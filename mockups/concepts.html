<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Widget Design Concepts — Bible + Trading</title>
<style>
  :root{
    --phone-w: 390px;
    --phone-h: 844px;
    --sc: .68;
    --gap: 14px;
    --pad: 22px;
    --radius-widget: 28px;
    --muted: rgba(255,255,255,.62);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:#07070c;
    background-image:
      radial-gradient(1100px 700px at 15% -10%, #16213f 0%, transparent 60%),
      radial-gradient(900px 700px at 110% 10%, #2a1740 0%, transparent 55%),
      radial-gradient(900px 900px at 50% 130%, #0d2b26 0%, transparent 60%);
    color:#fff; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    padding:30px 20px 70px;
  }
  .head{ text-align:center; max-width:720px; margin:0 auto 26px; }
  .head h1{ font-size:22px; letter-spacing:-.02em; margin:0 0 8px; }
  .head p{ margin:0; color:var(--muted); font-size:13.5px; line-height:1.55; }
  .rail{ display:flex; gap:34px; overflow-x:auto; padding:12px 4px 28px; scroll-snap-type:x mandatory; }
  .rail::-webkit-scrollbar{ height:10px; }
  .rail::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.14); border-radius:6px; }

  .card{ scroll-snap-align:center; flex:0 0 auto; }
  .cap{ text-align:center; margin-top:14px; max-width:280px; }
  .cap h3{ margin:0; font-size:14.5px; letter-spacing:-.01em; }
  .cap p{ margin:4px 0 0; font-size:11.5px; color:var(--muted); line-height:1.45; }

  .phone-view{ width: calc(var(--phone-w) * var(--sc)); height: calc(var(--phone-h) * var(--sc)); position:relative; }
  .phone{
    position:absolute; top:0; left:0;
    width: var(--phone-w); height: var(--phone-h);
    transform: scale(var(--sc)); transform-origin: top left;
    border-radius:54px; padding:11px;
    background:linear-gradient(160deg,#2a2a33,#0e0e12);
    box-shadow:0 34px 80px rgba(0,0,0,.7), 0 0 0 2px rgba(255,255,255,.06), inset 0 0 0 1px rgba(255,255,255,.05);
  }
  .screen{ position:relative; width:100%; height:100%; border-radius:44px; overflow:hidden; background:#000; }

  .wallpaper{
    position:absolute; inset:0;
    background:
      radial-gradient(120% 80% at 78% 8%, rgba(255,140,90,.55), transparent 45%),
      radial-gradient(100% 70% at 15% 30%, rgba(90,120,255,.45), transparent 50%),
      radial-gradient(120% 90% at 60% 100%, rgba(20,180,150,.35), transparent 55%),
      linear-gradient(160deg,#141a2e 0%, #0a0c16 45%, #060609 100%);
  }
  .wallpaper::after{
    content:""; position:absolute; inset:0; opacity:.8;
    background:
      radial-gradient(2px 2px at 20% 40%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.5px 1.5px at 70% 25%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.5px 1.5px at 40% 70%, rgba(255,255,255,.35), transparent),
      radial-gradient(1.5px 1.5px at 85% 65%, rgba(255,255,255,.3), transparent);
  }

  .statusbar{ position:relative; z-index:5; display:flex; justify-content:space-between; align-items:center; padding:16px 30px 4px; font-size:14px; font-weight:600; }
  .island{ position:absolute; top:11px; left:50%; transform:translateX(-50%); width:120px; height:34px; border-radius:20px; background:#000; z-index:6; }
  .statusbar .right{ display:flex; align-items:center; gap:6px; }
  .bars{ display:flex; align-items:flex-end; gap:2px; height:11px; }
  .bars i{ width:3px; background:#fff; border-radius:1px; }
  .bars i:nth-child(1){height:4px;} .bars i:nth-child(2){height:6px;} .bars i:nth-child(3){height:8px;} .bars i:nth-child(4){height:11px;}
  .batt{ width:24px; height:12px; border:1.5px solid rgba(255,255,255,.6); border-radius:3px; position:relative; }
  .batt::after{ content:""; position:absolute; right:-3px; top:3px; width:2px; height:4px; background:rgba(255,255,255,.6); border-radius:0 1px 1px 0; }
  .batt i{ position:absolute; inset:1.5px; width:70%; background:#fff; border-radius:1.5px; }

  .home{ position:relative; z-index:4; padding:12px var(--pad) 0; display:grid; grid-template-columns:repeat(2,1fr); gap:var(--gap); }
  .col-2{ grid-column:span 2; }

  .widget{ position:relative; border-radius:var(--radius-widget); padding:16px 17px; overflow:hidden; color:#fff; transition:.25s; }
  .w-label{ display:flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700; letter-spacing:.10em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
  .w-label svg{ width:12px; height:12px; }

  .sessions .next{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:12px; }
  .sessions .next .to{ font-size:12px; color:var(--muted); font-weight:600; }
  .sessions .next .who{ font-size:20px; font-weight:800; letter-spacing:-.02em; }
  .count{ font-variant-numeric:tabular-nums; font-size:30px; font-weight:800; letter-spacing:-.03em; line-height:1; }
  .pills{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
  .pill{ display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 4px; border-radius:14px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.08); }
  .pill .city{ font-size:10px; font-weight:700; } .pill .clock{ font-size:9.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .pill .st{ display:flex; align-items:center; gap:4px; font-size:9px; font-weight:800; letter-spacing:.06em; }
  .dot-led{ width:6px; height:6px; border-radius:50%; }
  .pill.on .dot-led{ background:#22c55e; box-shadow:0 0 8px #22c55e; animation:pulse 2s infinite; }
  .pill.off .dot-led{ background:#f43f5e; }
  @keyframes pulse{ 0%,100%{opacity:1;}50%{opacity:.35;} }

  .bible .ref{ font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#fbbf24; }
  .bible .verse{ margin-top:8px; font-size:14.5px; line-height:1.4; font-weight:600; font-family:"Iowan Old Style",Georgia,serif; }

  .mini .citybig{ font-size:17px; font-weight:800; }
  .mini .sub{ font-size:10.5px; font-weight:700; letter-spacing:.06em; margin-top:3px; display:flex; align-items:center; gap:5px; }
  .mini .bigtime{ margin-top:10px; font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.03em; }
  .mini .foot{ font-size:10px; color:var(--muted); font-weight:600; margin-top:2px; }

  .cal .row{ display:grid; grid-template-columns:30px 1fr auto; align-items:center; gap:10px; padding:7px 0; border-top:1px solid rgba(255,255,255,.08); }
  .cal .row:first-of-type{ border-top:0; }
  .cal .flag{ font-size:16px; text-align:center; }
  .cal .ev{ font-size:12.5px; font-weight:600; } .cal .ccy{ font-size:9.5px; color:var(--muted); font-weight:700; letter-spacing:.06em; }
  .cal .t{ font-size:12px; font-weight:800; font-variant-numeric:tabular-nums; text-align:right; }
  .impact{ display:inline-flex; gap:2px; margin-left:6px; vertical-align:middle; }
  .impact i{ width:4px; height:4px; border-radius:50%; }
  .i-high i{ background:#f87171; box-shadow:0 0 6px #f87171; } .i-med i{ background:#fbbf24; } .i-low i{ background:rgba(255,255,255,.35); }
  .soon{ color:#fbbf24; } .live{ color:#34d399; }

  .dots{ position:relative; z-index:4; display:flex; justify-content:center; gap:7px; margin-top:14px; }
  .dots i{ width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.28); } .dots i:first-child{ background:#fff; }

  /* ============ CONCEPT: FROSTED ============ */
  .phone[data-concept="frosted"] .widget{
    background:rgba(28,28,34,.42);
    -webkit-backdrop-filter:blur(22px) saturate(150%); backdrop-filter:blur(22px) saturate(150%);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 10px 30px rgba(0,0,0,.28);
  }

  /* ============ CONCEPT: CLEAR ============ */
  .phone[data-concept="clear"] .widget{ background:transparent; border:1px solid rgba(255,255,255,.10); text-shadow:0 1px 8px rgba(0,0,0,.65),0 1px 2px rgba(0,0,0,.7); }
  .phone[data-concept="clear"] .widget::before{ content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(180deg,rgba(0,0,0,.20),rgba(0,0,0,.05)); }
  .phone[data-concept="clear"] .count{ color:#fff !important; }
  .phone[data-concept="clear"] .pill{ background:rgba(255,255,255,.05); }

  /* ============ CONCEPT: NOIR ============ */
  .phone[data-concept="noir"] .wallpaper{ filter:brightness(.55) saturate(.7); }
  .phone[data-concept="noir"] .widget{ background:rgba(0,0,0,.74); border:1px solid rgba(255,255,255,.06); border-radius:34px; }
  .phone[data-concept="noir"] .bible .ref{ color:#7CF6C9; }
  .phone[data-concept="noir"] .count{ background:linear-gradient(180deg,#7CF6C9,#39d6a5); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .phone[data-concept="noir"] .pill.on{ border-color:rgba(124,246,201,.4); }
  .phone[data-concept="noir"] .pill.on .dot-led{ background:#7CF6C9; box-shadow:0 0 8px #7CF6C9; }
  .phone[data-concept="noir"] .soon{ color:#7CF6C9; } .phone[data-concept="noir"] .live{ color:#7CF6C9; }

  /* ============ CONCEPT: TYPO ============ */
  .phone[data-concept="typo"] .widget{ background:transparent; border:0; border-radius:0; padding:14px 6px; box-shadow:none; }
  .phone[data-concept="typo"] .w-label{ opacity:.75; }
  .phone[data-concept="typo"] .count{ font-size:46px; font-weight:300; letter-spacing:-.04em; font-variant-numeric:tabular-nums; text-shadow:0 2px 20px rgba(0,0,0,.5); }
  .phone[data-concept="typo"] .sessions .next .who{ font-weight:300; font-size:22px; letter-spacing:0; }
  .phone[data-concept="typo"] .pill{ background:transparent; border:0; border-top:1px solid rgba(255,255,255,.18); border-radius:0; padding:8px 2px; }
  .phone[data-concept="typo"] .pills{ gap:14px; }
  .phone[data-concept="typo"] .bible .ref{ color:#fff; opacity:.7; font-weight:600; }
  .phone[data-concept="typo"] .bible .verse{ font-size:17px; font-weight:400; text-shadow:0 2px 14px rgba(0,0,0,.6); }
  .phone[data-concept="typo"] .mini .citybig{ font-weight:300; }
  .phone[data-concept="typo"] .mini .bigtime{ font-weight:300; }
  .phone[data-concept="typo"] .cal .row{ border-top:1px solid rgba(255,255,255,.14); }
  .phone[data-concept="typo"] .cal .ev{ font-weight:400; }

  /* ============ CONCEPT: TERMINAL ============ */
  .phone[data-concept="terminal"] .wallpaper{ filter:brightness(.5) saturate(.5) hue-rotate(60deg); }
  .phone[data-concept="terminal"] .home{ font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace; }
  .phone[data-concept="terminal"] .widget{ background:rgba(3,12,10,.80); border:1px solid rgba(0,255,170,.28); border-radius:12px; box-shadow:0 0 0 1px rgba(0,0,0,.4) inset, 0 10px 30px rgba(0,0,0,.4); }
  .phone[data-concept="terminal"] .w-label{ color:#2ee6a8; letter-spacing:.08em; }
  .phone[data-concept="terminal"] .count,.phone[data-concept="terminal"] .count span{ color:#5affc0; text-shadow:0 0 12px rgba(90,255,192,.6); }
  .phone[data-concept="terminal"] .pill{ background:rgba(0,255,170,.06); border:1px solid rgba(0,255,170,.20); border-radius:8px; }
  .phone[data-concept="terminal"] .pill.on .dot-led{ background:#5affc0; box-shadow:0 0 8px #5affc0; }
  .phone[data-concept="terminal"] .pill.off .dot-led{ background:#ff5c7a; }
  .phone[data-concept="terminal"] .bible .verse{ font-family:inherit; font-size:13px; }
  .phone[data-concept="terminal"] .bible .ref,.phone[data-concept="terminal"] .soon,.phone[data-concept="terminal"] .live{ color:#5affc0; }
  .phone[data-concept="terminal"] .cal .row{ border-top:1px dashed rgba(0,255,170,.22); }
</style>
</head>
<body>
  <div class="head">
    <h1>Widget Concepts — pick a direction</h1>
    <p>Same wallpaper, same data, five different treatments of the exact same widgets (FX sessions + countdown, Bible verse, London session, forex news). Scroll sideways. All countdowns are live and real.</p>
  </div>
  <div class="rail" id="rail"></div>

<script>
const SESSIONS=[
  {city:"Sydney",open:22*60,dur:9*60,off:600},
  {city:"Tokyo",open:0,dur:9*60,off:540},
  {city:"London",open:8*60,dur:9*60,off:60},
  {city:"New York",open:13*60,dur:9*60,off:-240},
];
const CONCEPTS=[
  {id:"frosted",name:"1 · Frosted Glass",desc:"Blurred translucent card. Always looks clean on any wallpaper, never breaks."},
  {id:"clear",name:"2 · Invisible / Clear",desc:"Fully see-through — the widget 'disappears' into the wallpaper. The true transparent look."},
  {id:"noir",name:"3 · OLED Noir",desc:"Pure-black cards with a mint accent. Saves battery on OLED, ultra-crisp, moody."},
  {id:"typo",name:"4 · Typographic",desc:"No cards at all — just big airy type and hairline rules floating on the wallpaper."},
  {id:"terminal",name:"5 · Trading Terminal",desc:"Monospace data-grid with neon green. Pro-terminal vibe for the markets widgets."},
];

function state(s,nowMin){const diff=(nowMin-s.open+1440)%1440;const open=diff<s.dur;return{open,nextOpen:open?0:(s.open-nowMin+1440)%1440,closeIn:open?(s.dur-diff):0};}
function fmtHM(m){m=Math.floor(m);return Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m";}
function fmtClock(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/3600)).padStart(2,"0")+":"+String(Math.floor(sec%3600/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");}
function localTime(off){const d=new Date();const t=(d.getUTCHours()*60+d.getUTCMinutes()+off+1440)%1440;return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");}

const ICON={
  clock:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none"><path d="M6 3h9a3 3 0 0 1 3 3v15l-6-3-6 3V6a3 3 0 0 1 0-3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
  globe:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18" stroke="currentColor" stroke-width="2"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="3" stroke="currentColor" stroke-width="2"/><path d="M3 9h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
};

function homeHTML(){
  return `
  <div class="home">
    <div class="widget sessions col-2">
      <div class="w-label">${ICON.clock} FX Market Sessions <span class="live" style="margin-left:auto;font-weight:800">● LIVE</span></div>
      <div class="next">
        <div><div class="to">Opens in</div><div class="who count-who">New York</div></div>
        <div class="count countdown">00:00:00</div>
      </div>
      <div class="pills"></div>
    </div>
    <div class="widget bible">
      <div class="w-label">${ICON.book} Verse of the Day</div>
      <div class="ref">Proverbs 3:5–6</div>
      <div class="verse">“Trust in the Lord with all your heart, and lean not on your own understanding.”</div>
    </div>
    <div class="widget mini">
      <div class="w-label">${ICON.globe} London</div>
      <div class="citybig">London</div>
      <div class="sub mini-status"></div>
      <div class="bigtime mini-time">08:00</div>
      <div class="foot mini-foot">—</div>
    </div>
    <div class="widget cal col-2">
      <div class="w-label">${ICON.cal} Forex Economic News <span style="margin-left:auto;font-weight:700">Today</span></div>
      <div class="row"><div class="flag">🇺🇸</div><div><div class="ev">Core CPI <span class="impact i-high"><i></i><i></i><i></i></span></div><div class="ccy">USD · High impact</div></div><div class="t soon">13:30</div></div>
      <div class="row"><div class="flag">🇬🇧</div><div><div class="ev">BoE Rate Decision <span class="impact i-high"><i></i><i></i><i></i></span></div><div class="ccy">GBP · High impact</div></div><div class="t">12:00</div></div>
      <div class="row"><div class="flag">🇪🇺</div><div><div class="ev">ECB Lagarde Speech <span class="impact i-med"><i></i><i></i><i></i></span></div><div class="ccy">EUR · Medium impact</div></div><div class="t">09:45</div></div>
    </div>
  </div>
  <div class="dots"><i></i><i></i><i></i></div>`;
}

function phoneHTML(c){
  return `
    <div class="island"></div>
    <div class="screen">
      <div class="wallpaper"></div>
      <div class="statusbar"><span class="sb-time">9:41</span><span class="right"><span class="bars"><i></i><i></i><i></i><i></i></span><svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.5l1.6-1.9a2.4 2.4 0 0 0-3.2 0L8 10.5z" fill="#fff"/><path d="M4.6 6.6a5.4 5.4 0 0 1 6.8 0" stroke="#fff" stroke-width="1.3"/><path d="M2 4a9 9 0 0 1 12 0" stroke="#fff" stroke-width="1.3"/></svg><span class="batt"><i></i></span></span></div>
      ${homeHTML()}
    </div>`;
}

const rail=document.getElementById("rail");
CONCEPTS.forEach(c=>{
  const card=document.createElement("div"); card.className="card";
  const v=document.createElement("div"); v.className="phone-view";
  const p=document.createElement("div"); p.className="phone"; p.dataset.concept=c.id;
  p.innerHTML=phoneHTML(c);
  v.appendChild(p);
  const cap=document.createElement("div"); cap.className="cap";
  cap.innerHTML=`<h3>${c.name}</h3><p>${c.desc}</p>`;
  card.appendChild(v); card.appendChild(cap); rail.appendChild(card);
  updatePhone(p);
});

function updatePhone(phone){
  const now=new Date();
  const nowMin=now.getUTCHours()*60+now.getUTCMinutes(), s=now.getUTCSeconds();
  const states=SESSIONS.map(x=>({...x,...state(x,nowMin)}));
  let best=states.filter(x=>!x.open).sort((a,b)=>a.nextOpen-b.nextOpen)[0];
  if(!best) best=states.slice().sort((a,b)=>a.nextOpen-b.nextOpen)[0];
  const who=phone.querySelector(".count-who"); if(who) who.textContent=best.city;
  const cd=phone.querySelector(".countdown"); if(cd) cd.textContent=fmtClock(best.nextOpen*60-s);
  const pills=phone.querySelector(".pills");
  if(pills) pills.innerHTML=states.map(x=>`<div class="pill ${x.open?'on':'off'}"><span class="city">${x.city}</span><span class="clock">${localTime(x.off)}</span><span class="st"><span class="dot-led"></span>${x.open?'OPEN':'CLOSED'}</span></div>`).join("");
  const l=states.find(x=>x.city==="London");
  const st=phone.querySelector(".mini-status");
  if(st) st.innerHTML=`<span class="dot-led" style="width:6px;height:6px;border-radius:50%;display:inline-block;background:${l.open?'#22c55e':'#f43f5e'};${l.open?'box-shadow:0 0 8px #22c55e':''}"></span> ${l.open?'OPEN':'CLOSED'}`;
  const mt=phone.querySelector(".mini-time"); if(mt) mt.textContent=localTime(60);
  const mf=phone.querySelector(".mini-foot"); if(mf) mf.textContent=l.open?("closes in "+fmtHM(l.closeIn)):("opens in "+fmtHM(l.nextOpen));
  const sbt=phone.querySelector(".sb-time"); if(sbt) sbt.textContent=((now.getHours()%12)||12)+":"+String(now.getMinutes()).padStart(2,"0");
}

setInterval(()=>document.querySelectorAll(".phone").forEach(updatePhone),1000);
</script>
</body>
</html>
