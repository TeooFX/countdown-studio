name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project CountdownStudio.xcodeproj \
            -scheme CountdownStudio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/CountdownStudio.app"
          ls -la "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr CountdownStudio.ipa Payload
          echo "IPA size:"; ls -la CountdownStudio.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CountdownStudio-ipa
          path: CountdownStudio.ipa
          if-no-files-found: error
